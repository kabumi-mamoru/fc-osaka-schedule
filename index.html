<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC OSAKA 2026/27 SCHEDULE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #000E2A;
  --blue:       #0044BB;
  --cyan:       #00D4FF;
  --red:        #FF4040;
  --white:      #FFFFFF;
  --silver:     #A8C0E0;
  --card-h:     #01183D;
  --card-a:     #1A0822;
  --sep:        rgba(255,255,255,0.06);
}

html, body {
  background: var(--bg);
  font-family: 'Noto Sans JP', sans-serif;
  -webkit-font-smoothing: antialiased;
  max-width: 480px;
  margin: 0 auto;
}

/* ─── HEADER ─── */
.header {
  background: linear-gradient(150deg, #000C22 0%, #003090 60%, #0044BB 100%);
  padding: 24px 18px 18px;
  border-bottom: 2px solid var(--cyan);
  position: relative;
  overflow: hidden;
}
.header::before {
  content: 'OSAKA';
  position: absolute;
  right: -8px; bottom: -12px;
  font-family: 'Oswald', sans-serif;
  font-size: 80px;
  font-weight: 700;
  color: rgba(0,212,255,0.06);
  pointer-events: none;
  line-height: 1;
}
.badge-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.j3-pill {
  background: var(--cyan);
  color: #000E2A;
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 2px 10px 2px 8px;
  clip-path: polygon(0 0,100% 0,88% 100%,0 100%);
  letter-spacing: 1px;
}
.league-txt {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--silver);
}
.title {
  font-family: 'Oswald', sans-serif;
  font-size: 38px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  text-shadow: 0 0 24px rgba(0,212,255,0.3);
  text-decoration: none;
  display: inline-block;
}
.title:hover, .title:active { text-decoration: underline; }
.title em { color: var(--cyan); font-style: normal; }
.subtitle {
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--silver);
  margin-top: 5px;
}

/* ─── LEGEND ─── */
.legend {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 9px 16px;
  background: rgba(0,0,0,0.45);
  border-bottom: 1px solid var(--sep);
  flex-wrap: wrap;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--silver);
  letter-spacing: 1px;
}
.leg-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.leg-dot.h { background: var(--cyan); }
.leg-dot.a { background: var(--red); }
.leg-note {
  margin-left: auto;
  font-size: 9.5px;
  color: rgba(168,192,224,0.5);
  line-height: 1.4;
}

/* ─── MONTH GROUP ─── */
.month-block { padding: 0 14px; }
.month-hd {
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--cyan);
  padding: 13px 2px 5px;
  border-bottom: 1px solid rgba(0,212,255,0.18);
  margin-bottom: 5px;
  opacity: 0.75;
}

/* ─── CARD ─── */
.card {
  display: flex;
  align-items: stretch;
  margin-bottom: 5px;
  border-radius: 5px;
  overflow: hidden;
}
.card-bar {
  width: 3px;
  flex-shrink: 0;
}
.card.h .card-bar { background: var(--cyan); }
.card.a .card-bar { background: var(--red); }

.card-inner {
  flex: 1;
  display: grid;
  grid-template-columns: 52px 1px 118px 1fr;
  align-items: center;
  padding: 11px 12px 11px 10px;
  gap: 10px;
  min-width: 0;
}
.card.h .card-inner { background: var(--card-h); }
.card.a .card-inner { background: var(--card-a); }

/* 節 + badge */
.card-meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.node-num {
  font-family: 'Oswald', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}
.node-label {
  font-size: 9px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1px;
}
.ha {
  font-family: 'Oswald', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 6px;
  border-radius: 2px;
}
.ha.h {
  color: var(--cyan);
  background: rgba(0,212,255,0.12);
  border: 1px solid rgba(0,212,255,0.3);
}
.ha.a {
  color: var(--red);
  background: rgba(255,64,64,0.12);
  border: 1px solid rgba(255,64,64,0.3);
}

/* セパレーター */
.vsep { background: var(--sep); align-self: stretch; }

/* 日程 */
.card-date {}
.d1 {
  font-family: 'Oswald', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  line-height: 1.1;
  white-space: nowrap;
}
.d2-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
}
.d-or {
  font-size: 9px;
  color: rgba(168,192,224,0.45);
}
.d2 {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
}
.d-time {
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  color: var(--cyan);
  margin-top: 3px;
  letter-spacing: 0.5px;
  opacity: 0.85;
}

/* 対戦相手 */
.card-opp {
  font-size: 12px;
  font-weight: 700;
  color: var(--silver);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 1px solid var(--sep);
  padding-left: 10px;
  line-height: 1.3;
}
.card-stadium {
  display: inline-block;
  font-size: 10px;
  font-weight: 400;
  color: rgba(168,192,224,0.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
  letter-spacing: 0.2px;
  text-decoration: none;
  max-width: 100%;
}
.card-stadium:hover, .card-stadium:active {
  color: var(--cyan);
  text-decoration: underline;
}

/* ─── FOOTER ─── */
.footer {
  margin-top: 6px;
  padding: 14px 18px;
  background: rgba(0,0,0,0.5);
  border-top: 1px solid rgba(0,212,255,0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.f-note { font-size: 10px; color: rgba(168,192,224,0.4); }
.f-logo {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: 3px;
}

/* ─── RECORD / RESULT ─── */
.record {
  margin-top: 10px;
  font-family: 'Oswald', 'Noto Sans JP', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--silver);
}
.record b { color: #fff; font-weight: 700; }
.record .pt { color: var(--cyan); }

.opp-name { white-space: normal; overflow-wrap: anywhere; }
.result { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.res-badge {
  display: inline-grid;
  place-items: center;
  width: 20px; height: 20px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 900;
  line-height: 1;
}
.res-badge.w { background: var(--cyan); color: #000E2A; }
.res-badge.d { background: #8A9BB8;     color: #000E2A; }
.res-badge.l { background: var(--red);  color: #fff; }
.res-score {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}
.next-pill {
  display: block;
  width: fit-content;
  margin-top: 4px;
  margin-bottom: 2px;
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--cyan);
  border: 1px solid rgba(0,212,255,0.5);
  border-radius: 10px;
  padding: 1px 8px;
}
.card.done .card-meta,
.card.done .card-date,
.card.done .opp-name { opacity: 0.65; }
.card.next .card-inner { box-shadow: inset 0 0 0 1px rgba(0,212,255,0.35); }
</style>
</head>
<body>

<div class="header">
  <div class="badge-row">
    <div class="j3-pill">J3</div>
    <div class="league-txt">明治安田 J3 LEAGUE</div>
  </div>
  <a class="title" href="https://www.fc-osaka.com/" target="_blank" rel="noopener">FC <em>OSAKA</em></a>
  <div class="subtitle">2026/27 &nbsp; MATCH SCHEDULE</div>
  <div class="record" id="record"></div>
</div>

<div class="legend">
  <div class="leg-item"><div class="leg-dot h"></div>HOME</div>
  <div class="leg-item"><div class="leg-dot a"></div>AWAY</div>
  <div class="leg-note">※土日の節は金・月曜開催の可能性あり</div>
</div>

<div id="sched"></div>

<div class="footer">
  <div class="f-note">2026.08.08 〜 2027.05.23 ｜ 全38節</div>
  <div class="f-logo">FC OSAKA</div>
</div>

<script>
// [節, H/A, 日付1, 日付2orNull, 対戦相手, KO時間orNull, 会場(AWAYは相手ホーム/HOMEは通常null・変更時のみ指定), スコアorNull(FC大阪側が先 例:"2-1")]
const DATA = [
  ["第01節","AWAY","08/08(土)",null,"vs.ガイナーレ鳥取","19:00","Axisバードスタジアム","1-1"],
  ["第02節","HOME","08/16(日)",null,"vs.AC長野パルセイロ","18:00",null,"4-2"],
  ["第03節","HOME","08/22(土)",null,"vs.FC琉球","18:00","ミクニワールドスタジアム北九州","2-2"],
  ["第04節","AWAY","08/30(日)",null,"vs.レノファ山口FC","19:00","維新みらいふスタジアム","0-0"],
  ["第05節","AWAY","09/05(土)",null,"vs.松本山雅FC","18:00","サンプロ アルウィン","0-0"],
  ["第06節","HOME","09/14(月)",null,"vs.愛媛FC","19:00",null,"2-1"],
  ["第07節","HOME","09/18(金)",null,"vs.福島ユナイテッドFC","19:00",null,"4-1"],
  ["第08節","AWAY","09/26(土)",null,"vs.高知ユナイテッドSC","17:00","高知県立春野総合運動公園陸上競技場","4-0"],
  ["第09節","AWAY","10/03(土)",null,"vs.SC相模原","17:00","相模原ギオンスタジアム","0-1"],
  ["第10節","HOME","10/09(金)",null,"vs.ツエーゲン金沢","19:00","たけびしスタジアム京都","1-1"],
  ["第11節","AWAY","10/17(土)",null,"vs.ギラヴァンツ北九州","14:00","ミクニワールドスタジアム北九州","1-3"],
  ["第12節","HOME","10/21(水)",null,"vs.奈良クラブ","19:00",null,"2-0"],
  ["第13節","HOME","10/24(土)",null,"vs.鹿児島ユナイテッドFC","14:00",null,"2-1"],
  ["第14節","AWAY","10/31(土)",null,"vs.FC岐阜","14:00","岐阜メモリアルセンター長良川競技場",null],
  ["第15節","HOME","11/04(水)",null,"vs.ロアッソ熊本","14:00","万博記念競技場",null],
  ["第16節","AWAY","11/07(土)",null,"vs.ザスパ群馬","14:00","正田醤油スタジアム群馬",null],
  ["第17節","AWAY","11/15(日)",null,"vs.レイラック滋賀FC","18:00","平和堂HATOスタジアム",null],
  ["第18節","HOME","11/22(日)",null,"vs.カマタマーレ讃岐","15:00",null,null],
  ["第19節","HOME","11/25(水)",null,"vs.栃木SC","19:00",null,null],
  ["第20節","AWAY","11/29(日)",null,"vs.ロアッソ熊本","13:00","えがお健康スタジアム",null],
  ["第21節","AWAY","12/06(日)",null,"vs.奈良クラブ","14:00","ロートフィールド奈良",null],
  ["第22節","HOME","12/12(土)","12/13(日)","vs.SC相模原",null,null,null],
  ["第23節","HOME","02/20(土)","02/21(日)","vs.ギラヴァンツ北九州",null,null,null],
  ["第24節","AWAY","02/27(土)","02/28(日)","vs.カマタマーレ讃岐",null,"四国化成MEGLIOスタジアム",null],
  ["第25節","HOME","03/06(土)","03/07(日)","vs.レノファ山口FC",null,null,null],
  ["第26節","AWAY","03/13(土)","03/14(日)","vs.FC琉球",null,"沖縄県総合運動公園陸上競技場",null],
  ["第27節","AWAY","03/17(水)",null,"vs.福島ユナイテッド",null,"とうほう・みんなのスタジアム",null],
  ["第28節","HOME","03/20(土)","03/21(日)","vs.ザスパ群馬",null,null,null],
  ["第29節","AWAY","03/27(土)","03/28(日)","vs.栃木SC",null,"カンセキスタジアムとちぎ",null],
  ["第30節","HOME","04/03(土)","04/04(日)","vs.レイラック滋賀FC",null,null,null],
  ["第31節","AWAY","04/10(土)","04/11(日)","vs.鹿児島ユナイテッドFC",null,"白波スタジアム",null],
  ["第32節","HOME","04/17(土)","04/18(日)","vs.ガイナーレ鳥取",null,null,null],
  ["第33節","AWAY","04/24(土)","04/25(日)","vs.ツエーゲン金沢",null,"金沢ゴーゴーカレースタジアム",null],
  ["第34節","HOME","04/29(木)",null,"vs.松本山雅FC",null,null,null],
  ["第35節","AWAY","05/03(月)","05/04(火)","vs.愛媛FC",null,"ニンジニアスタジアム",null],
  ["第36節","HOME","05/09(日)",null,"vs.FC岐阜",null,null,null],
  ["第37節","AWAY","05/15(土)","05/16(日)","vs.AC長野パルセイロ",null,"長野Uスタジアム",null],
  ["第38節","HOME","05/23(日)",null,"vs.高知ユナイテッドSC",null,null,null],
];

const RES_LABEL = { w: '勝', d: '分', l: '負' };
function parseScore(s) {
  if (!s) return null;
  const [a, b] = s.split('-').map(Number);
  return { a, b, r: a > b ? 'w' : a < b ? 'l' : 'd' };
}

// 成績集計 & 次の試合
const cnt = { w: 0, d: 0, l: 0 };
let played = 0;
DATA.forEach(r => { const p = parseScore(r[7]); if (p) { cnt[p.r]++; played++; } });
const nextRow = DATA.find(r => !r[7]);
document.getElementById('record').innerHTML =
  `<b>${cnt.w}</b>勝 <b>${cnt.d}</b>分 <b>${cnt.l}</b>敗 ｜ <span class="pt">勝点 <b>${cnt.w * 3 + cnt.d}</b></span> ｜ ${played}/${DATA.length}節`;

function getMonth(d) {
  const m = d.match(/^(\d{2})\//);
  return m ? m[1] + '月' : '';
}

// 月グループ化
const groups = new Map();
DATA.forEach(row => {
  const mo = getMonth(row[2]);
  if (!groups.has(mo)) groups.set(mo, []);
  groups.get(mo).push(row);
});

const sched = document.getElementById('sched');

groups.forEach((rows, mo) => {
  const block = document.createElement('div');
  block.className = 'month-block';

  const hd = document.createElement('div');
  hd.className = 'month-hd';
  hd.textContent = '── ' + mo;
  block.appendChild(hd);

  rows.forEach(row => {
    const [num, ha, d1, d2, opp, time, venue, score] = row;
    const p = parseScore(score);
    const tag = p
      ? `<span class="result"><span class="res-badge ${p.r}">${RES_LABEL[p.r]}</span><span class="res-score">${p.a}-${p.b}</span></span>`
      : (row === nextRow ? '<span class="next-pill">NEXT</span>' : '');
    const isH = ha === 'HOME';
    const cls = isH ? 'h' : 'a';
    const numOnly = num.replace('第','').replace('節','');
    const teamName = opp.replace('vs.', '');
    const stadium = venue || '';

    const card = document.createElement('div');
    card.className = `card ${cls}${p ? ' done' : ''}${row === nextRow ? ' next' : ''}`;
    card.innerHTML = `
      <div class="card-bar"></div>
      <div class="card-inner">
        <div class="card-meta">
          <div class="node-label">第</div>
          <div class="node-num">${numOnly}</div>
          <div class="node-label">節</div>
          <div class="ha ${cls}">${ha}</div>
        </div>
        <div class="vsep"></div>
        <div class="card-date">
          <div class="d1">${d1}</div>
          ${d2 ? `<div class="d2-row"><span class="d-or">or</span><span class="d2">${d2}</span></div>` : ''}
          ${time ? `<div class="d-time">🕐 ${time} KO</div>` : ''}
        </div>
        <div class="card-opp">
          <div class="opp-name">${opp}</div>${tag}
          ${stadium ? `<a class="card-stadium" href="https://www.google.com/maps/search/${encodeURIComponent(stadium)}" target="_blank" rel="noopener">📍 ${stadium}</a>` : ''}
        </div>
      </div>`;
    block.appendChild(card);
  });

  sched.appendChild(block);
});
</script>
</body>
</html>
